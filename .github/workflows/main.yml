 name: BIOG RUSSIA APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Find and unpack project
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)
          mkdir -p buildsrc
          unzip -q "$ZIP" -d buildsrc
          echo "ZIP: $ZIP"
          find buildsrc -maxdepth 3 -type f | head -50

      - name: Build APK
        run: |
          ROOT=$(dirname "$(find buildsrc -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) | head -n 1)")
          cd "$ROOT"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: BIOG-RUSSIA-APK
          path: buildsrc/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
